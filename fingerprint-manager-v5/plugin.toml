# Fingerprint Manager - enroll, delete, and test fingerprints via fprintd.
#
# v5 Luau port of the v4 QML plugin (see ../fingerprint-manager). Wraps the
# fprintd-list/enroll/delete/verify CLI tools; no D-Bus boilerplate of its own.
# See README.md for fprintd + polkit-agent setup.

id           = "monkeymonk/fingerprint-manager"
name         = "Fingerprint Manager"
version      = "2.0.0"
plugin_api   = 24
author       = "Stephan Zych"
license      = "MIT"
repository   = "https://github.com/monkeymonk/noctalia-plugins"
description  = "Enroll, delete, and test fingerprints via fprintd"
icon         = "fingerprint"
tags         = ["bar", "panel", "system", "security"]
dependencies = ["fprintd"]

# Shared by the bar widget, the control-center shortcut, and the panel.
# Mirrors the v4 "iconColor" setting (the bar/shortcut glyph color). v4's
# "showInControlCenter" setting has no v5 equivalent - the control-center
# shortcut below is added/removed by the user from Settings -> Control
# Center Shortcuts like any other shortcut, so a plugin-level visibility
# toggle would be redundant.
[[setting]]
key              = "icon_color"
type             = "color"
label_key        = "settings.icon_color.label"
description_key  = "settings.icon_color.description"
default          = "on_surface"

[[widget]]
id    = "bar"
entry = "widget.luau"

  # Entry-level duplicate of the plugin-level icon_color above: without this,
  # the Bar widget list has nothing of its own to show a settings gear for.
  # The widget entry's value wins over the plugin-level one when both are set
  # (per-instance override), matching how built-in widgets' "Color" setting
  # behaves in the bar editor.
  [[widget.setting]]
  key              = "icon_color"
  type             = "color"
  label_key        = "settings.icon_color.label"
  description_key  = "settings.icon_color.description"
  default          = "on_surface"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 440
height          = 560
placement       = "attached"
position        = "auto"
open_near_click = true

[[shortcut]]
id    = "shortcut"
entry = "shortcut.luau"
