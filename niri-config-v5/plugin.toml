[[widget]]
id = "widget"
entry = "widget.luau"

  # Entry-level duplicate of the plugin-level icon_color above: without this,
  # the Bar widget list has nothing of its own to show a settings gear for.
  # The widget entry's value wins over the plugin-level one when both are set.
  [[widget.setting]]
  key              = "icon_color"
  type             = "color"
  label_key        = "settings.icon_color.label"
  description_key  = "settings.icon_color.description"
  default          = "on_surface"

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"
