name: catalog

on:
  push:
    branches: [master, main]
    # Every plugin directory must trigger this, so filter by exclusion rather
    # than by naming each one - a new plugin is covered without editing this
    # file. catalog.toml itself is excluded so the bot's own commit below
    # cannot retrigger the workflow.
    paths-ignore:
      - 'catalog.toml'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Two pushes in quick succession would otherwise race to push catalog.toml,
# and the loser fails on a non-fast-forward.
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # update-catalog.py walks each plugin.toml's full history to build the
      # [[plugin.release]] ladder, so a shallow checkout would emit no rows.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate catalog.toml
        run: python3 .github/workflows/scripts/update-catalog.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain catalog.toml)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add catalog.toml
            git commit -m 'chore: regenerate catalog.toml'
            git push
          else
            echo 'catalog.toml already up to date'
          fi
