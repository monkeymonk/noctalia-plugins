name: registry

on:
  push:
    branches: [master, main]
    # Every plugin directory must trigger this, so filter by exclusion rather
    # than by naming each one — a new plugin is covered without editing this
    # file. registry.json itself is excluded so the bot's own commit below
    # cannot retrigger the workflow.
    paths-ignore:
      - 'registry.json'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Two pushes in quick succession would otherwise race to push registry.json,
# and the loser fails on a non-fast-forward.
concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate registry.json
        run: python3 scripts/build-registry.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain registry.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add registry.json
            git commit -m 'chore: regenerate registry.json'
            git push
          else
            echo 'registry.json already up to date'
          fi
